spring:
  application:
    name: condaty-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true        # habilita el descubrimiento automático
          lower-case-service-id: true
      routes:
        # Microservicio de Autenticación - PÚBLICO
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1  # Elimina /auth del path antes de enrutar
        # Los demás microservicios serán descubiertos automáticamente por Eureka

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

jwt:
  secret: mySecretKeyForJWTTokenGenerationAndValidation1234567890
  expiration: 86400000  # 24 horas en milisegundos

logging:
  level:
    '[org.springframework.cloud.gateway]': DEBUG
    '[org.springframework.security]': DEBUG
    '[com.condaty]': DEBUG

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    urls:
      - name: auth-service
        url: http://localhost:8081/v3/api-docs
  show-actuator: false
