spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/condaty_core
    username: postgres
    password: Esteban99
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

jwt:
  secret: mySecretKeyForJWTTokenGenerationAndValidation1234567890
  expiration: 86400000  # 24 horas en milisegundos

logging:
  level:
    '[org.springframework.security]': DEBUG
    '[com.condaty.auth_service]': DEBUG
    '[com.condaty]': DEBUG
