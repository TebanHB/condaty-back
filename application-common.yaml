# =====================================================
# CONFIGURACIÓN COMÚN PARA TODOS LOS MICROSERVICIOS
# =====================================================
# Este archivo debe ser referenciado en cada microservicio
# mediante: spring.config.import=file:../application-common.yaml

# Configuración de Eureka (Service Discovery)
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# Configuración de Base de Datos - Core (PostgreSQL)
datasource:
  core:
    url: jdbc:postgresql://localhost:5432/condaty_core
    username: postgres
    password: Esteban99
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

# Configuración de Redis (Sesiones y Caché)
redis:
  host: localhost
  port: 6379
  password: # Dejar vacío si no tiene password
  timeout: 2000ms
  lettuce:
    pool:
      max-active: 8
      max-idle: 8
      min-idle: 2
      max-wait: -1ms

# Configuración de JWT (compartida entre servicios)
jwt:
  secret: mySecretKeyForJWTTokenGenerationAndValidation1234567890
  expiration: 86400000  # 24 horas en milisegundos
  refresh-expiration: 604800000  # 7 días en milisegundos

# Configuración de Logging común
logging:
  level:
    '[com.condaty]': INFO
    '[org.springframework.web]': INFO
    '[org.springframework.security]': INFO
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'

# Management y Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Configuración de timezone
spring:
  jackson:
    time-zone: America/La_Paz
    date-format: yyyy-MM-dd'T'HH:mm:ss
